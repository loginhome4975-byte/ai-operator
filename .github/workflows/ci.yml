name: AI Operator CI/CD

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-asyncio requests fastapi uvicorn pydantic httpx redis

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Tests
        run: |
          echo "No tests yet. Add tests to tests/ directory and update this step."

  docker-build:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Orchestrator Image
        run: docker build -t ai-operator/orchestrator:latest ./infra_orchestrator

      - name: Build SIP Bridge Image
        run: docker build -t ai-operator/sip_bridge:latest ./infra_sip_bridge

      - name: Build Dashboard Image
        run: docker build -t ai-operator/dashboard:latest ./infra_orchestrator/admin_dashboard

      # Example for pushing to registry:
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v2
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}
